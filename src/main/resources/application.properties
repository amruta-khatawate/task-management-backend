spring.application.name=task-manager-backend

server.port=${PORT:8095}

# H2 In-Memory Database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=${DB_URL:jdbc:h2:mem:taskmanager}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
##data initialization happens later, first table will be created then insert values in data.sql file
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.h2.console.enabled=false

# SQL Logging
spring.jpa.show-sql=false


